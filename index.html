<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta name="description" content="Explora la historia, las facciones y los combatientes de Trench Crusade en esta wiki comunitaria gratuita.">
    <meta name="theme-color" content="#090909">
    <link rel="preload" as="image" href="images/templario.webp" fetchpriority="high">

</head>
<body>
    <nav class="site-nav">
        <a class="site-brand" href="#" onclick="Landing(); return false;">

            <span>TRENCH CRUSADE</span>
        </a>
        <div class="nav-links" id="wiki-nav">
            <button onclick="openWiki('home')">Personajes</button>
